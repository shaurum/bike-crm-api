[project]
name = "bike-crm-api"
version = "0.1.0"
description = "CRM API для проката электробайков"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==22.0.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pydantic-extra-types==2.7.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "redis==5.0.1",
    "celery==5.4.0",
    "httpx==0.27.0",
    "jinja2==3.1.4",
    "weasyprint==61.2",
    "structlog==24.1.0",
    "python-dotenv==1.0.1",
    "email-validator==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.8",
    "mypy==1.10.0",
    "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RSE", "RET", "FLY", "PD", "PGH", "TID", "INP", "ISC", "ICN", "PIE", "T20", "QCS", "RUF", "ASYNC", "LOG"]
ignore = ["E501", "B008", "C901", "SIM117", "PT004", "PT006", "PT007", "PT011", "PT013", "PT015", "PT017", "PT018", "PT019", "PTH118", "PTH123", "TRY003", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]