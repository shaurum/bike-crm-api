name: Deploy

# Деплой по релизу на VPS: тег v* создаёт Release (release.yml), а этот workflow
# заходит на VPS по SSH и запускает scripts/deploy-vps.sh. На VPS работает
# облачный шлюз интеграций (Telegram, Авито): скрипт обновляет его код и
# пересобирает контейнер, при неудаче откатывает. CRM обновляется там, только
# если она на этом сервере установлена. Ручной запуск ставит последний релиз.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    # Без VPS обновления ставит автообновление на ПК (scripts/auto-update.ps1),
    # поэтому без секретов шаг пропускается, а не роняет каждый релиз
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: VPS не настроен
        if: env.HAS_VPS != 'true'
        run: echo "::notice::Секреты VPS_HOST и SSH_PRIVATE_KEY не заданы, деплой по SSH пропущен; релиз установит автообновление"

      - name: Деплой по SSH
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes \
            "${VPS_USER:-root}@${VPS_HOST}" sh -s -- "$TAG" < scripts/deploy-vps.sh
