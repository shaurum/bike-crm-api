name: Deploy

# Деплой по релизу: тег v* создаёт Release (release.yml) и тут же
# просит VPS установить его немедленно (обычно VPS подхватывает сам по cron).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    # Без VPS обновления ставит автообновление на ПК (scripts/auto-update.ps1),
    # поэтому без секретов шаг пропускается, а не роняет каждый релиз
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: VPS не настроен
        if: env.HAS_VPS != 'true'
        run: echo "::notice::Секреты VPS_HOST и SSH_PRIVATE_KEY не заданы, деплой по SSH пропущен; релиз установит автообновление"

      - name: Деплой по SSH
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ ! -f /opt/bike-crm/scripts/auto-update.sh ]; then
              echo "Репозиторий ещё не клонирован на сервер — выполните первый клон" >&2
              exit 1
            fi
            bash /opt/bike-crm/scripts/auto-update.sh
            cat /opt/bike-crm/backend/.update_state.json 2>/dev/null || true
