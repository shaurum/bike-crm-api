version: '3.8'

services:
  # -----------------------------------------
  # PostgreSQL 16
  # -----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bike-crm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bike_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bike_crm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bike_crm}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bike_crm} -d ${POSTGRES_DB:-bike_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bike-crm-network

  # -----------------------------------------
  # Redis 7
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bike-crm-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bike-crm-network

  # -----------------------------------------
  # Backend API (FastAPI)
  # -----------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike-crm-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - GATEWAY_URL=${GATEWAY_URL:-}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bike-crm-network
    restart: unless-stopped

  # -----------------------------------------
  # Frontend (Next.js) — только внутри сети, наружу через nginx
  # -----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bike-crm-frontend
    # npm install при старте: анонимный том node_modules переживает пересборку образа,
    # поэтому новые зависимости из package.json подтягиваем здесь
    command: sh -c "npm install --no-audit --no-fund && npx next dev -p 3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - bike-crm-network
    restart: unless-stopped

  # -----------------------------------------
  # Nginx — единая точка входа на порту 3000:
  # /api, /uploads, /health -> backend, остальное -> frontend.
  # Снаружи (Keenetic) открывается только 3000 -> nginx.
  # -----------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: bike-crm-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - bike-crm-network
    restart: unless-stopped

  # -----------------------------------------
  # Celery Worker — для асинхронных задач
  # -----------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike-crm-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GATEWAY_URL=${GATEWAY_URL:-}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-}
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    healthcheck:
      # В Dockerfile проверка идёт на HTTP :8000/health, а celery его не поднимает
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bike-crm-network
    restart: unless-stopped

  # -----------------------------------------
  # Celery Beat — планировщик задач
  # -----------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bike-crm-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GATEWAY_URL=${GATEWAY_URL:-}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-}
    volumes:
      - ./backend:/app
    healthcheck:
      # В Dockerfile проверка идёт на HTTP :8000/health, а celery его не поднимает
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bike-crm-network
    restart: unless-stopped

networks:
  bike-crm-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
